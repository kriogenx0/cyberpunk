server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

  # hashed build assets can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The app uses #hash routes only, so any other path is a real 404
  # (an HTML 200 for unknown URLs reads as duplicate content / soft 404s).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }

  location ~* \.txt$ {
    charset utf-8;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  error_page 404 /404.html;
}
